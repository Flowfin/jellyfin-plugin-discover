name: Publish Release

# Pushing a tag of the form X.Y.Z-stable or X.Y.Z.W-stable is the only way a release
# is published. CI builds the plugin from the tagged commit, creates the GitHub release
# for that tag and uploads the assets. No release is ever created by hand.
#
# A run of this workflow that fails raises an issue in this repository, in the alert job
# at the bottom. A failed run nobody is watching is the same as no check at all, and the
# two failures this route has - a tag that publishes nothing, and a run that reports
# success while shipping nothing - are both silent unless something writes them where a
# person reads. #121.
#
# The second trigger below exists so that alert can be watched firing without minting
# anything. A dispatch is refused by the first step of the gate job, before the checkout
# and whatever ref it names, so it reaches no build, no attestation and no release. That
# refusal is what keeps the paragraph above true now that a second trigger exists: a tag
# push is still the only thing that publishes.
#
# The numeric part of the tag is the plugin version Jellyfin installs. It must equal
# build.yaml's `version`, and the gate job below fails the run if it does not.
#
# What this workflow publishes is one package for the one server line build.yaml names
# in `framework` and `targetAbi`. A repository that ships two server lines needs a
# second manifest and a second route; this file does not provide one, and the checks
# below refuse to guess.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-stable"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-stable"
  # This publishes nothing. It fails at the gate's first step, and the only thing it
  # produces is the alert, which is the point of it: the alert path cannot otherwise be
  # watched failing without pushing a tag, and a tag that released nothing is a state
  # every later reader has to explain.
  #
  # DISPATCH THIS ON A THROWAWAY BRANCH AND NOT ON master. The run's jobs attach as
  # check-runs to whatever commit the ref names, and this run is meant to fail, so a
  # dispatch on master leaves a mainline commit reading as red for as long as the run is
  # kept. That happened on the run that first proved the alert, 33947960318 against
  # 67cc791, and it is recorded on #121 rather than repaired, because deleting the run
  # would delete the evidence the proof rests on. A branch cut from master carries this
  # file and dispatches identically, where <name> is a branch name nothing else uses:
  #
  #     git push origin master:<name>
  #     gh workflow run publish.yaml --ref <name> -f prove_the_alert=true
  #
  # <name> is a placeholder because the branch is thrown away after the dispatch, so no
  # name written here would be the one a reader uses. It was also the way around a check:
  # branch-name-exists read a fully qualified ref in a comment and refused it like a live
  # one. #430 has since narrowed both its spellings to state nothing about a comment and
  # proves that on a fixture, so a real spelling would pass and still name no branch.
  workflow_dispatch:
    inputs:
      prove_the_alert:
        description: >-
          Say in the alert that this run was started on purpose. A dispatch fails and
          publishes nothing either way; this only changes what the alert says about it.
        type: boolean
        default: false
        required: false

# Deny by default. Each job opts into the smallest scope it needs.
permissions: {}

# One publish per tag. The group is keyed on the tag rather than on the workflow,
# because two different tags share no state here and GitHub keeps at most one queued
# run per group: a shared group silently drops the middle tag of three pushed in a
# row, and a dropped run ends as cancelled, which sends no failure anywhere.
# cancel-in-progress stays false so a run holding contents:write is never killed
# between creating a release and attaching its assets.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release metadata gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Refuse a run that no tag push started
        # First, and before the checkout, so a dispatch reaches nothing at all. The ref
        # is deliberately not consulted: a dispatch can name a tag as readily as a
        # branch, and a dispatch naming a tag would otherwise walk the whole gate and
        # publish a release nobody pushed a tag for. What this reads is the event, which
        # no ref can change.
        if: ${{ github.event_name != 'push' }}
        env:
          DELIBERATE: ${{ inputs.prove_the_alert }}
        run: |
          set -euo pipefail
          if [ "${DELIBERATE}" = "true" ]; then
            echo "::error::This run was started to watch the alert fire, and it fails here on purpose. Nothing was checked out, built, attested or released."
          else
            echo "::error::This workflow publishes from a tag push and from nothing else. A dispatch fails here, whatever ref it names, and publishes nothing. Push a tag to publish."
          fi
          exit 1

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the checkout to the commit recorded in the push event. Without this,
          # actions/checkout resolves a tag ref against origin at the moment the job
          # runs, so a tag force-moved while the run is in flight would put a different
          # tree in front of the ancestry check below than the one that gets built.
          # A 40 character hex ref is treated as a commit, not as a ref to resolve.
          ref: ${{ github.sha }}
          # Full history so the ancestry check below can compare the tagged commit
          # against the release branches.
          fetch-depth: 0
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Write the manifest reader
        # One reader, in a file, so the parsing rules are stated once. A quoted scalar
        # ends at its closing quote, and an unquoted one ends at a comment or at the end
        # of the line. Trailing whitespace and a CR from a CRLF checkout are removed
        # before either rule is applied, because otherwise the closing quote is no
        # longer the last character on the line and stays in the value.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manifest"
          cat > "${RUNNER_TEMP}/manifest/read_scalar.awk" <<'AWK'
          index($0, key ":") == 1 {
            value = substr($0, length(key) + 2)
            sub(/\r$/, "", value)
            sub(/^[[:space:]]+/, "", value)
            sub(/[[:space:]]+$/, "", value)
            if (substr(value, 1, 1) == "\"") {
              value = substr(value, 2)
              end = index(value, "\"")
              if (end > 0) { value = substr(value, 1, end - 1) }
            } else if (substr(value, 1, 1) == "'") {
              value = substr(value, 2)
              end = index(value, "'")
              if (end > 0) { value = substr(value, 1, end - 1) }
            } else {
              sub(/[[:space:]]*#.*$/, "", value)
              sub(/[[:space:]]+$/, "", value)
            }
            print value
            exit
          }
          AWK

      - name: Check the tag and build.yaml agree
        id: metadata
        env:
          # Space separated list of branches a release may be cut from.
          RELEASE_REFS: "master"
          EXPECTED_FRAMEWORK: "net9.0"
        run: |
          set -euo pipefail

          # A run started from a branch would name the release after the branch and tag
          # a commit nobody released. A dispatch is already refused above, before the
          # checkout, and this stays as a second and independent bound: it reads the ref
          # rather than the event, so it still refuses a trigger added after this line.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow publishes from a tag only, but it was started from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
            exit 1
          fi

          # The checkout above asked for a commit rather than for the tag. Read that
          # back instead of trusting it, so a change to the checkout step that reopens
          # the moved-tag window shows up here rather than in a signed release.
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::The working tree is at ${head}, but the push event recorded ${GITHUB_SHA}. The tag was moved after the run started, or the checkout step no longer pins the commit."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            *-stable) numeric="${tag%-stable}" ;;
            *)
              echo "::error::Tag ${tag} does not end in -stable."
              exit 1
              ;;
          esac

          if [ ! -f build.yaml ]; then
            echo "::error::build.yaml is missing from the repository root. The packaging step reads all plugin metadata from it."
            exit 1
          fi

          # The packaging tool takes the first of several file names it recognises, and
          # build.yaml is last in that list. A leftover jprm.yaml or meta.yaml would be
          # packaged instead of the file every check here reads.
          shadow=0
          for other in jprm.yaml .jprm.yaml .ci/jprm.yaml .github/jprm.yaml .gitlab/jprm.yaml meta.yaml; do
            if [ -f "${other}" ]; then
              echo "::error::${other} exists. The packaging tool reads it in preference to build.yaml, so the package would carry metadata nothing in this workflow checked. Remove it or fold it into build.yaml."
              shadow=1
            fi
          done
          if [ "${shadow}" -ne 0 ]; then
            exit 1
          fi

          read_scalar() {
            awk -v key="$1" -f "${RUNNER_TEMP}/manifest/read_scalar.awk" build.yaml
          }

          # changelog is in this list because the packaging tool reads build_cfg
          # ['changelog'] without a default and dies with a Python KeyError when it is
          # absent. That happens after the plugin has already been compiled, which is
          # far past the point where the tag is spent.
          missing=0
          for key in name guid version targetAbi framework owner overview description category artifacts changelog; do
            if ! grep -Eq "^${key}:" build.yaml; then
              echo "::error::build.yaml has no top level '${key}' field. A catalog entry built from this package would be incomplete."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          # `image` names a file that is copied into the archive. The packaging tool
          # exits on a missing one, again after the build.
          if grep -Eq "^image:" build.yaml; then
            image="$(read_scalar image)"
            if [ ! -f "${image}" ]; then
              echo "::error::build.yaml declares image '${image}', which is not in the repository. The packaging step copies that file into the archive and fails without it."
              exit 1
            fi
          fi

          version="$(read_scalar version)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::build.yaml version '${version}' is not three or four numeric parts (X.Y.Z or X.Y.Z.W)."
            exit 1
          fi

          if [ "${version}" != "${numeric}" ]; then
            echo "::error::Tag ${tag} carries version ${numeric} but build.yaml declares ${version}. Bump build.yaml, or tag the version that is in it."
            exit 1
          fi

          abi="$(read_scalar targetAbi)"
          if [[ ! "${abi}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::build.yaml targetAbi '${abi}' is not four numeric parts (A.B.C.D). Jellyfin compares this value to decide whether to offer the plugin at all."
            exit 1
          fi

          framework="$(read_scalar framework)"
          if [ "${framework}" != "${EXPECTED_FRAMEWORK}" ]; then
            echo "::error::build.yaml framework '${framework}' does not match the target this workflow builds (${EXPECTED_FRAMEWORK}). Either the manifest names a runtime the project is not compiled for, or the workflow was filled in for a different server line."
            exit 1
          fi

          guid="$(read_scalar guid)"
          if [[ ! "${guid}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::build.yaml guid '${guid}' is not a UUID. It must be the plugin's own, permanent id."
            exit 1
          fi

          # A tag can be pushed onto any commit, including one that was never merged.
          # Require the tagged commit to be contained in a release branch.
          reachable=0
          for branch in ${RELEASE_REFS}; do
            if git rev-parse --verify --quiet "refs/remotes/origin/${branch}" >/dev/null; then
              if git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${branch}"; then
                reachable=1
                break
              fi
            else
              echo "::warning::There is no branch named '${branch}' on origin, so it cannot contain anything. Check the release branch list this workflow was filled in with."
            fi
          done
          if [ "${reachable}" -ne 1 ]; then
            echo "::error::Commit ${GITHUB_SHA} is not contained in any of the release branches (${RELEASE_REFS}), so it must not be published."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${version} from tag ${tag}."

      - name: Check the changelog names the version
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        # CHANGELOG.md is where this project states a version's changes in its own
        # words. The notes on the release are composed by the forge from the commit
        # range, so they are a different artefact with a different author and they do
        # not stand in for it. Until now nothing compared the version being published
        # with the file that is supposed to describe it, and the state that produces is
        # a released version whose line is still sitting under Unreleased.
        #
        # The comparison is tools/changelog-names-the-version.sh rather than a block
        # here, so it can be run against the changelog before a tag exists. Nothing in
        # this workflow can be watched refusing without pushing a tag, and a tag that
        # created a release cannot be reused.
        run: tools/changelog-names-the-version.sh "${VERSION}" CHANGELOG.md

      - name: Set up .NET
        # The three checks below ask MSBuild for properties and compile nothing. They
        # sat in the build job until the build became a call into build-run.yml, which
        # takes no inputs and holds no release-only step, so the checks that compare
        # the project against the manifest moved here, in front of the build rather
        # than beside it. Neither workflow sets a dependency cache.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Check the project is built for the target in the manifest
        env:
          EXPECTED_FRAMEWORK: "net9.0"
        # Asked of MSBuild rather than read out of the project file, because the target
        # frameworks are often set in Directory.Build.props or behind a property. The
        # packaging step runs `dotnet publish -f <target>`, and a target the project
        # does not declare fails there with NETSDK1005, after the gate has passed.
        run: |
          set -euo pipefail
          singular="$(dotnet msbuild "Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj" -getProperty:TargetFramework -nologo | tr -d '[:space:]')"
          plural="$(dotnet msbuild "Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj" -getProperty:TargetFrameworks -nologo | tr -d '[:space:]')"
          declared="${plural:-${singular}}"
          if [ -z "${declared}" ]; then
            echo "::error::Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj declares neither TargetFramework nor TargetFrameworks."
            exit 1
          fi
          found=0
          IFS=';' read -ra frameworks <<< "${declared}"
          for tfm in "${frameworks[@]}"; do
            if [ "${tfm}" = "${EXPECTED_FRAMEWORK}" ]; then
              found=1
            fi
          done
          if [ "${found}" -ne 1 ]; then
            echo "::error::Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj is built for '${declared}', which does not include ${EXPECTED_FRAMEWORK}. build.yaml and the project disagree about which server line this is. Bring them into line before tagging."
            exit 1
          fi
          if [ "${#frameworks[@]}" -gt 1 ]; then
            echo "::notice::The project is built for ${declared}. This run publishes only ${EXPECTED_FRAMEWORK}, the line build.yaml names. The other lines are not published by this workflow."
          fi

      - name: Check the committed lock file exists
        # The build restores in locked mode wherever CI is set, which
        # Directory.Build.props states and every runner here sets, so the graph the
        # release is compiled from is the one in packages.lock.json or the build fails.
        # That refusal is NuGet's and its message names a lock file rather than a
        # release, so the absence is named here first, where the way out fits in one
        # line. Creating one is a single command and is written up in docs/RELEASING.md.
        run: |
          set -euo pipefail
          project="Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj"
          lock="$(dirname "${project}")/packages.lock.json"
          if [ ! -f "${lock}" ]; then
            echo "::error::${lock} does not exist. The build restores in locked mode so the shipped bytes come from the dependency graph that was reviewed. Run: dotnet restore ${project} -p:RestorePackagesWithLockFile=true, then commit the file."
            exit 1
          fi

      - name: Check the assembly version matches the manifest
        env:
          MANIFEST_VERSION: ${{ needs.gate.outputs.version }}
          EXPECTED_FRAMEWORK: "net9.0"
        # The gate proved the tag and the manifest agree. Nothing so far has looked at
        # the number that ends up inside the DLL, and a project that sets AssemblyVersion
        # by hand can ship a plugin whose assembly says one thing while the catalog entry
        # says another. A three part number is padded to four on both sides before they
        # are compared, because 1.4.0 and 1.4.0.0 are the same version written twice.
        run: |
          set -euo pipefail
          assembly="$(dotnet msbuild "Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj" \
            -getProperty:AssemblyVersion -nologo \
            -p:TargetFramework="${EXPECTED_FRAMEWORK}" | tr -d '[:space:]')"
          if [ -z "${assembly}" ]; then
            echo "::error::Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj sets no AssemblyVersion, so the build stamps the SDK default and the shipped DLL will not carry ${MANIFEST_VERSION}."
            exit 1
          fi
          if [[ ! "${assembly}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj stamps AssemblyVersion '${assembly}', which is not three or four numeric parts, so it cannot be the manifest version ${MANIFEST_VERSION}."
            exit 1
          fi
          want="${MANIFEST_VERSION}"
          got="${assembly}"
          case "${want}" in *.*.*.*) ;; *) want="${want}.0" ;; esac
          case "${got}" in *.*.*.*) ;; *) got="${got}.0" ;; esac
          if [ "${want}" != "${got}" ]; then
            echo "::error::build.yaml declares version ${MANIFEST_VERSION} but the assembly is stamped ${assembly}. Derive the assembly version from build.yaml so the two cannot drift, or fix whichever one is wrong."
            exit 1
          fi
          echo "Assembly version ${assembly} matches the manifest."

  build:
    # The gate's build, called rather than copied (#35, #119). build-run.yml is the
    # reusable workflow build.yaml calls on every pull request, so there is one build
    # definition and not a second copy of its steps here, which is what makes "what
    # the gate tested is what ships" a property of the tree rather than a hope about
    # two files staying alike. It checks out the commit the push event recorded, reads
    # the server line from Directory.Build.props, packages with the same tool at the
    # same pin, writes the bill of materials, and uploads the archive, the descriptor
    # written beside it and the inventory as one artifact named build-artifact. The
    # version the packager reads out of build.yaml is the one the gate job above
    # proved equals the tag.
    #
    # One definition is then proved rather than inherited: the compare job below
    # fetches the artifact the gate uploaded for the tagged commit on the mainline and
    # refuses to publish a package whose entries differ from it. The gate's artifact
    # is compared with and never shipped, because an artifact expires and a release
    # has to be repeatable on the day it is gone.
    #
    # The signing scopes are deliberately not granted to this call: the build runs a
    # NuGet restore and arbitrary MSBuild logic from every restored package, and a job
    # that can be made to run someone else's code must not also be able to mint an
    # attestation under this repository's identity.
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/build-run.yml

  compare:
    name: Prove the package is the gate's
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads two artifacts and runs the comparison. It checks out nothing, restores
    # nothing and holds no write scope; `actions: read` is what lets it list the
    # gate's runs for this commit and download the artifact one of them uploaded.
    permissions:
      actions: read
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Download the package this run built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact
          path: ours

      - name: Fetch the comparison
        # The script and nothing else, at the tagged commit. A checkout of the whole
        # tree would put build tooling within reach of this job for no reason.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p tools
          gh api "repos/${GH_REPO}/contents/tools/package-matches-the-gate.sh?ref=${COMMIT}" \
            -H "Accept: application/vnd.github.raw+json" > tools/package-matches-the-gate.sh
          chmod +x tools/package-matches-the-gate.sh

      - name: Fetch the gate's artifact for the tagged commit
        id: theirs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          MAINLINE: master
        # The gate is build.yaml on a push to the mainline, and the tagged commit is
        # on the mainline or the gate job above has already refused it. A run that
        # succeeded and still holds its artifact is what there is to compare with.
        # Where there is none, this step says so rather than failing: an artifact is
        # kept for thirty days, and a release cut later than that from a commit the
        # gate did test must still be possible. What it cannot then be is proved, and
        # the release body carries that sentence in place of the comparison.
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GH_REPO}/actions/workflows/build.yaml/runs?head_sha=${COMMIT}&branch=${MAINLINE}&event=push&status=success&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')"
          if [ -z "${runs}" ]; then
            echo "reason=no successful run of build.yaml on ${MAINLINE} exists for ${COMMIT}" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No successful run of build.yaml on ${MAINLINE} exists for ${COMMIT}, so there is no gate artifact to compare the package with."
            exit 0
          fi
          for run in ${runs}; do
            live="$(gh api "repos/${GH_REPO}/actions/runs/${run}/artifacts" \
              --jq '[.artifacts[] | select(.name == "build-artifact" and .expired == false)] | length')"
            if [ "${live}" -gt 0 ]; then
              gh run download "${run}" --repo "${GH_REPO}" --name build-artifact --dir theirs
              echo "run=${run}" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Comparing with the artifact of run ${run}."
              exit 0
            fi
          done
          echo "reason=the gate's artifact for ${COMMIT} has expired (runs: $(printf '%s ' ${runs}))" >> "$GITHUB_OUTPUT"
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Every successful run of build.yaml on ${MAINLINE} for ${COMMIT} has lost its artifact to the retention window, so there is no gate artifact to compare the package with."

      - name: Compare the two packages entry by entry
        id: verdict
        env:
          FOUND: ${{ steps.theirs.outputs.found }}
          RUN: ${{ steps.theirs.outputs.run }}
          REASON: ${{ steps.theirs.outputs.reason }}
          COMMIT: ${{ github.sha }}
          RUN_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        # The verdict is one line, and it is written into the release body by the
        # release job so a reader of the release meets it without opening a run. A
        # refusal is the script's exit status; a comparison that could not be made is
        # not a pass and is written as exactly that.
        run: |
          set -euo pipefail
          if [ "${FOUND}" != "true" ]; then
            echo "verdict=Not compared with the gate's artifact: ${REASON}. The package was built by the gate's own workflow and nothing proved it equal to what the gate tested at this commit." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ours="$(find ours -name '*.zip' | head -n 1)"
          theirs="$(find theirs -name '*.zip' | head -n 1)"
          if [ -z "${ours}" ] || [ -z "${theirs}" ]; then
            echo "::error::One of the two artifacts carries no archive (release: '${ours}', gate: '${theirs}')."
            exit 1
          fi
          tools/package-matches-the-gate.sh "${ours}" "${theirs}"
          echo "verdict=Built by the gate's workflow and compared entry by entry with the artifact the gate uploaded for ${COMMIT} in run ${RUN_URL_BASE}/${RUN}: identical, apart from the timestamp in meta.json." >> "$GITHUB_OUTPUT"

  attest:
    name: Attest build provenance
    needs: [build, compare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can mint an attestation under this repository's identity, and
    # it runs no build tooling and checks out nothing. It sees the archive and the
    # OIDC token and nothing else.
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Attest build provenance
        # Signs a SLSA v1.1 provenance statement for the exact archive this run
        # produced, keyless, using the OIDC token above. A downloaded archive is checked
        # against it with `gh attestation verify`. This comment said `--repo` pins the
        # workflow as well; it does not, and docs/RELEASING.md says what does. #124.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "./*.zip"

  release:
    name: Publish the release
    needs: [build, compare, attest]
    runs-on: ubuntu-latest
    # Generous, because this job builds nothing and the time it spends is asset
    # uploads on somebody else's network. A timeout that fires between creating the
    # release and attaching the last asset leaves exactly the half-published release
    # the concurrency setting above exists to avoid.
    timeout-minutes: 45
    # The only job with write access, and it runs no build tooling.
    permissions:
      contents: write
    steps:
      # No checkout. This job only handles the bytes the build job produced.
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Refuse to touch a release that already exists
        env:
          GH_TOKEN: ${{ github.token }}
        # The upload step below replaces an asset of the same name without complaint,
        # so a second run on the same tag would swap the bytes of a version people have
        # already installed and report success. Asked before anything is written, and
        # anything other than a clean 404 stops the run.
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "${code}" in
            404)
              echo "No release exists for ${GITHUB_REF_NAME} yet."
              ;;
            200)
              echo "::error::A release already exists for ${GITHUB_REF_NAME}. Its assets are what people have installed, so this run will not replace them. Raise the version in build.yaml and push a new tag. docs/RELEASING.md describes the case where the first run left the release incomplete."
              exit 1
              ;;
            *)
              echo "::error::Asking whether a release exists for ${GITHUB_REF_NAME} returned HTTP ${code}. Not publishing on an unclear answer."
              exit 1
              ;;
          esac

      - name: Write the checksums
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Exactly one archive, therefore exactly one .md5. The MD5 sidecar is the
          # value a Jellyfin catalog serves as the plugin checksum, and a catalog
          # generator that picks a checksum by filename will pick the wrong one the
          # moment a second .md5 exists. Every other asset gets a sha256 instead.
          zips=(./*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin archive, found ${#zips[@]}."
            exit 1
          fi

          metas=(./*.zip.meta.json)
          if [ "${#metas[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaging metadata file, found ${#metas[@]}."
            exit 1
          fi

          zip="${zips[0]#./}"
          # The bare filename, so the checksum line names the file a client downloads.
          md5sum "${zip}" > "${zip%.zip}.md5"
          sha256sum "${zip}" > "${zip%.zip}.sha256"
          ls -l

      - name: Create the release and upload the assets
        # Creates the release for the pushed tag and attaches the five files named
        # below: the archive, its descriptor, the bill of materials the gate wrote for
        # it, and the two checksums. Named rather than globbed, so a file that starts
        # arriving in the artifact is a change somebody has to look at before it ships.
        # fail_on_unmatched_files keeps a run that produced nothing from publishing an
        # empty release. overwrite_files is false because the default is true, and
        # silently replacing a published asset is the one thing this route must never
        # do. The body is the compare job's one line, in front of the notes the forge
        # composes, so the release says on its own page whether the package was proved
        # to be the gate's.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          body: ${{ needs.compare.outputs.verdict }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          preserve_order: true
          files: |
            ./*.zip
            ./*.zip.meta.json
            ./sbom.cyclonedx.json
            ./*.md5
            ./*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  alert:
    name: Raise an alert for a failed publish
    needs: [gate, build, compare, attest, release]
    # always(), because a job that runs only when its needs succeeded is exactly the job
    # that never runs here. The condition names what it reads rather than using
    # failure(): a run that was CANCELLED raises nothing, and that bound is stated on
    # #121 rather than left to be found.
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Writes an issue and nothing else. It checks out nothing, restores nothing and
    # never sees the archive, so the one job that can write to the tracker runs none of
    # the tooling the build job runs.
    permissions:
      issues: write
    steps:
      - name: Open an issue naming what failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          DELIBERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_the_alert }}
          GATE_RESULT: ${{ needs.gate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMPARE_RESULT: ${{ needs.compare.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        # One issue per failed run, keyed on the run id in its title, with no attempt to
        # fold a second failure into a first. A publish runs on a tag push, which is
        # rare, so what this can produce is bounded by how often somebody tags; folding
        # would lose the second alert of two, which is the direction a route about
        # unseen failures must not fail in.
        run: |
          set -euo pipefail

          body="${RUNNER_TEMP}/alert-body.md"
          {
            echo "The publish workflow failed. No release was published by this run."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Release metadata gate | \`${GATE_RESULT}\` |"
            echo "| Build (build-run.yml) | \`${BUILD_RESULT}\` |"
            echo "| Prove the package is the gate's | \`${COMPARE_RESULT}\` |"
            echo "| Attest build provenance | \`${ATTEST_RESULT}\` |"
            echo "| Publish the release | \`${RELEASE_RESULT}\` |"
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Attempt: ${RUN_ATTEMPT}"
            echo "- Started by: \`${EVENT_NAME}\`, on ${REF_TYPE} \`${REF_NAME}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Failed at: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            if [ "${DELIBERATE}" = "true" ]; then
              echo "This run was started on purpose, to watch this alert fire. It published"
              echo "nothing: a dispatch is refused by the first step of the gate job, before"
              echo "the checkout, so no build, no attestation and no release ran. Close this"
              echo "issue once it has been read."
            else
              echo "Read the run, fix what it names, and raise the version in \`build.yaml\`"
              echo "before tagging again. A tag that has already created a release is never"
              echo "reused, and \`docs/RELEASING.md\` says what to do when a run left a"
              echo "release half-published."
            fi
            echo
            echo "Opened by the workflow run linked above, and carrying only what that run"
            echo "reported."
          } > "${body}"

          title="Publish failed on ${REF_NAME}, run ${RUN_ID}"

          # The label, the milestone and the assignee are how this issue reaches a
          # listing rather than only a notification. They are not worth losing the alert
          # over, so a refusal on any of them is retried without them and says so.
          if ! url="$(gh issue create --title "${title}" --body-file "${body}" \
                --label ci --label "area: release" \
                --milestone "M11 Release and catalogue readiness" \
                --assignee iderex)"; then
            echo "::warning::Opening the alert with its label, milestone and assignee was refused. Opening it with the title and body alone, because an alert nobody sees is the failure this job exists against."
            url="$(gh issue create --title "${title}" --body-file "${body}")"
          fi

          echo "::notice::Alert raised: ${url}"

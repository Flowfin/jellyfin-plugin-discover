name: "🧪 Test Plugin"

# Neither trigger carries a path filter, for the reason written out in
# build.yaml (#154). `call / test` is required on the default branch, and a
# workflow that never starts leaves that context missing rather than green, so a
# filter here refuses the merge of every change it skips.
# `required-check-runs-on-every-change` in tools/invariants refuses its return.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

jobs:
  call:
    # The steps now live in this repository, in test-run.yml, which says there
    # why it is a called workflow rather than a job written out here. The
    # upstream wrapper it replaces pinned its own SDK version, which is a second
    # answer to a question Directory.Build.props already answers.
    permissions:
      contents: read # checkout only
    uses: ./.github/workflows/test-run.yml

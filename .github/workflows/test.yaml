name: '🧪 Test Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

jobs:
  call:
    # Kept as a call for now: the upstream workflow is restore, build and
    # `dotnet test` over whatever the solution holds, which is what this
    # repository would write out by hand today and no more.
    permissions:
      contents: read # checkout only
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29

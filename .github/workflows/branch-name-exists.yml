# Every branch name a workflow states is a branch this repository has (#28).
#
# The workflows added on top of the template were written against a repository
# whose default branch is `main`. This one's is `master`, so `scorecard.yml` and
# `zizmor.yml` carried a push trigger that could never fire, and the repository
# read as covered by two audits that ran on a schedule or not at all. A trigger
# naming an absent branch fails silently by construction: GitHub does not warn,
# the workflow appears in the list, and the only visible difference is runs that
# are not there.
#
# What this refuses is a literal branch name that no branch of this repository
# carries, in either of the two places a workflow states one: a value under
# `branches:` or `branches-ignore:`, and a fully qualified head ref written
# into a step or job condition. The second spelling is not decoration.
# `zizmor.yml` guarded its upload of security findings on such a ref under the
# absent name, so correcting only the trigger would have left the audit running
# and its results going nowhere, which is the same silence one layer down.
#
# The literal that prefixes such a ref is assembled from two halves rather than
# written out anywhere in this file, because a check whose own prose, pattern
# or failure message carries the string it looks for refuses its own
# documentation. The assembly is at the line that does it.
#
# A value holding a glob character is a pattern rather than a name and is
# reported as skipped, because there is no branch for it to be compared
# against. So is a ref built out of a workflow expression, which is resolved at
# run time and is not a name written into the tree.
#
# What it cannot do. It reads the workflow files a line at a time rather than
# parsing YAML, so it knows the two spellings that are written here, a block
# list and a bracketed list, plus a plain scalar. A branch name arriving by an
# anchor, a merge key or a folded scalar would not be seen, and the run prints
# every value it did look at so a reader can tell the difference. It also says
# nothing about whether a workflow names the right branch: naming a branch that
# exists but is not the one the check was meant to guard passes here. And it
# reaches no prose: a comment describing a branch is not read, so a sentence
# that has gone stale against the tree it sits in stays for a person to catch.
#
# THAT LAST SENTENCE WAS TRUE OF THE FIRST SPELLING AND FALSE OF THE SECOND
# UNTIL #430. The ref arm was a grep over this directory that filtered nothing
# by syntax, so a fully qualified ref written in a comment was read and refused
# exactly like one in a job condition, and the stated bound under-claimed in the
# direction that surprises somebody mid-change: an example command in a comment
# could not carry a real ref spelling, and one page was reworded to route around
# a refusal rather than because the wording was better. The disagreement is
# settled towards the narrower reach, because what this check exists to refuse is
# a name that fails SILENTLY - a trigger that never fires, a condition that is
# never true - and a comment starts nothing. A comment that has gone stale is
# exactly the case the sentence above already hands to a person.
#
# So a comment is dropped before either spelling reads a line. A line whose
# first non-blank character opens one is not read at all, and a comment ending a
# line ends what that line states. The bound that leaves is the one a line-based
# reader always has: a `#` inside a quoted scalar ends the line here even though
# YAML would keep it, so a branch name written after such a `#` on the same line
# is not seen, and the run printing every value it did look at is where that
# shows. Dropping the line rather than ending the block also means a comment
# written inside a `branches:` list no longer stops the values under it being
# read, which they were not before.
#
# THE PAIR PROVES ITSELF ON EVERY RUN, BEFORE IT READS THIS DIRECTORY. The scan
# is one function and the step calls it twice: once on a fixture the step writes,
# carrying a comment with a fully qualified ref to a branch nothing has, a
# comment inside a `branches:` list, and a trailing comment after a live
# condition; and once on `.github/workflows/`. The fixture run has to return the
# two values that are not comments and nothing else, or the step fails before a
# branch list is fetched. The bound is executed rather than described, which is
# the whole of what #430 asked for.
name: branch-name-exists

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Read-only: the check greps the tracked workflow files and lists the branches.
permissions:
  contents: read

concurrency:
  group: branch-name-exists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: No workflow names a branch this repository does not have
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a branch name that is not a branch of this repository
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The literal that prefixes a fully qualified head ref, assembled from
          # two halves rather than written out, because a check whose own
          # machinery, prose or failure message carries the string it looks for
          # reads itself. The name is taken up to the first character a ref may
          # not carry, so a quote or a space ends it.
          head_ref='refs/''heads/'

          # Every branch name the workflow files under one directory state, as
          # the file, the line and the value. Both spellings are read in one
          # pass so that a comment is dropped once and for both of them: a value
          # under a branches: or branches-ignore: key, in a block list, a
          # bracketed list or a plain scalar, and a fully qualified head ref
          # written into a job or step condition.
          scan() {
            find "$1" -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
              | sort -z \
              | xargs -0 -r awk -v prefix="$head_ref" '
                function emit(v) {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
                  gsub(/^"|"$|^'"'"'|'"'"'$/, "", v)
                  if (v != "") print FILENAME ":" FNR "\t" v
                }
                FNR == 1 { inblock = 0 }
                {
                  line = $0

                  # Prose states nothing this check judges.
                  if (line ~ /^[[:space:]]*#/) next
                  sub(/[[:space:]]#.*$/, "", line)

                  rest = line
                  while ((at = index(rest, prefix)) > 0) {
                    rest = substr(rest, at + length(prefix))
                    match(rest, /^[^"'"'"'[:space:]]*/)
                    print FILENAME ":" FNR "\t" substr(rest, 1, RLENGTH)
                    rest = substr(rest, RLENGTH + 1)
                  }

                  if (match(line, /^[[:space:]]*branches(-ignore)?:[[:space:]]*/)) {
                    rest = substr(line, RLENGTH + 1)
                    gsub(/[[:space:]]+$/, "", rest)
                    if (rest == "") { inblock = 1; next }
                    inblock = 0
                    if (substr(rest, 1, 1) == "[") {
                      sub(/^\[/, "", rest)
                      sub(/\][[:space:]]*$/, "", rest)
                      n = split(rest, parts, ",")
                      for (i = 1; i <= n; i++) emit(parts[i])
                    } else {
                      emit(rest)
                    }
                    next
                  }
                  if (inblock) {
                    if (match(line, /^[[:space:]]*-[[:space:]]*/)) { emit(substr(line, RLENGTH + 1)); next }
                    if (line ~ /^[[:space:]]*$/) next
                    inblock = 0
                  }
                }
              '
          }

          # The proof, run before this repository's own files are read and
          # before a branch list is fetched, so a scan that has stopped drawing
          # the line it claims to draw fails here rather than passing quietly
          # over the tree. Three comments and two live values: none of the
          # comments may appear in the answer and both of the values must.
          fixture="$(mktemp -d)/workflows"
          mkdir -p "$fixture"
          {
            printf '# %sa-branch-nothing-has\n' "$head_ref"
            printf 'on:\n'
            printf '  push:\n'
            printf '    branches:\n'
            printf '      # %salso-nothing\n' "$head_ref"
            printf '      - read-me\n'
            printf 'jobs:\n'
            printf '  one:\n'
            printf "    if: github.ref == '%sread-me-too' # %sand-not-me\n" "$head_ref" "$head_ref"
          } >"$fixture/fixture.yml"

          expected=$(printf 'fixture.yml:6\tread-me\nfixture.yml:9\tread-me-too')
          observed=$(scan "$fixture" | sed 's#^[^:]*/##')
          if [ "$observed" != "$expected" ]; then
            echo "::error::The scan does not read its own fixture the way this file describes it. A comment is meant to state nothing and a condition is meant to be read; one of the two has stopped being true, so what this check refuses over the tree below cannot be trusted."
            printf 'expected:\n%s\n\nobserved:\n%s\n' "$expected" "$observed"
            exit 1
          fi
          echo 'The scan reads a condition and skips a comment, proven on a fixture before this directory was read.'
          echo

          # The branches this repository has, from the forge rather than from
          # the checkout, which is shallow and carries one ref.
          branches=$(gh api "repos/${THIS_REPOSITORY}/branches" --paginate --jq '.[].name')
          if [ -z "$branches" ]; then
            echo "::error::Could not read the branch list for ${THIS_REPOSITORY}. The check cannot judge a name against a list it does not have, so this is a failure rather than a pass."
            exit 1
          fi
          printf 'Branches on %s:\n' "$THIS_REPOSITORY"
          printf '%s\n' "$branches" | sed 's/^/  /'
          echo

          stated=$(scan .github/workflows | grep -v '^[[:space:]]*$' || true)

          if [ -z "$stated" ]; then
            echo "::error::No workflow states a branch name at all, which is not a state this repository has been in. Something changed in how the files are written and this check stopped reading them."
            exit 1
          fi

          fail=0
          while IFS=$'\t' read -r where value; do
            case "$value" in
              "")
                echo "skip  $where  (a head ref with no name after it)"
                continue
                ;;
              *['$'\{\}]*)
                echo "skip  $where  $value  (a workflow expression, resolved at run time)"
                continue
                ;;
              *[\*\?\[\]\!\+]*)
                echo "skip  $where  $value  (a pattern, not a name)"
                continue
                ;;
            esac
            if printf '%s\n' "$branches" | grep -Fxq -- "$value"; then
              echo "ok    $where  $value"
            else
              echo "FAIL  $where  $value"
              fail=1
            fi
          done <<< "$stated"

          if [ "$fail" -ne 0 ]; then
            echo "::error::A workflow names a branch ${THIS_REPOSITORY} does not have. A trigger on it never fires and a condition on it is never true, so the workflow reads as covering something it does not."
            exit 1
          fi

          echo
          echo "Every branch name stated in .github/workflows/ is a branch of ${THIS_REPOSITORY}."

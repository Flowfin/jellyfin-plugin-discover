# Allows for the definition of PR and Issue /commands
name: "📟 Slash Command Dispatcher"

on:
  issue_comment:
    types:
      - created

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

jobs:
  call:
    # Kept as a call, and #26 is where it is decided whether it is kept at all.
    # It serves the upstream project's comment-command process; the token passed
    # below is a placeholder rather than a credential, so it cannot work here as
    # it stands.
    permissions:
      contents: read # the dispatcher reads the repository to resolve the command
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    secrets:
      token: .

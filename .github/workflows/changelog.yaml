name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

jobs:
  call:
    # Kept as a call pending #26 and #21: it writes the version into
    # Directory.Build.props and build.yaml, which is the same ground #21 is
    # deciding, so owning the steps before that decision would fix a scheme this
    # repository has not chosen yet.
    permissions:
      contents: write # push the version-bump branch and draft the release
      pull-requests: write # open or update the release-prep pull request
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    with:
      repository-name: jellyfin/jellyfin-plugin-template
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

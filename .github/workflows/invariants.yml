# This plugin's own invariants, one rule per invariant (#33). Not a code
# scanner: nothing a general tool ships would know that a server channel type
# belongs only in the surface adapter, or that a read of the wall clock anywhere
# in this tree is a mistake outside the one class that exists to make it. That
# clause read as a wait until now, naming #47 as what would land the thing to
# read a clock through. #47 landed it and closed, so it is a rule with one
# exception rather than something still coming, and the exception is written at
# the rule rather than restated here: tools/invariants/rules/no-wall-clock.rule
# carries it. This comment did restate it, as the suffix *SystemClock.cs, and
# #387 rewrote every exception in that directory from a filename suffix into the
# path it means - so the copy went stale in the same act, which is the whole
# argument for not keeping one.
#
# The workflow does one thing, which is run the script. Everything else lives in
# tools/invariants: the rules, the fixtures that prove each one fires, and the
# runner. Adding an invariant is adding a rule file and a fixture, and this file
# is not edited for it.
#
# Nothing is downloaded and nothing is installed, so there is no pinned version
# here and no checksum to verify. The runner uses git and the shell, which is
# what the checkout already needs, and a supply chain of no parts is the cheapest
# one to hold.
name: invariants

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Read-only: the runner greps the tracked tree.
permissions:
  contents: read

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: This plugin's invariants hold
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Run the invariant lint
        run: ./tools/invariants/run.sh

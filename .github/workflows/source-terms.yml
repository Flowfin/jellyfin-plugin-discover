# A metadata source cannot be added without the page that turns its terms of use
# into obligations on this plugin (#75). A source's terms are requirements on
# behaviour, and the failure this refuses is the ordinary one: an adapter lands,
# it works, and the clause about how long its data may be kept is never written
# down anywhere the code can be checked against.
#
# Three legs, and each of them is reported before the run ends, so a red run
# names every reason rather than the first one.
#
#   1. A source with no page. A tracked C# type that implements
#      `IMetadataSource`, outside the test project, needs
#      `docs/sources/<token>.md` declaring `Source: <token>`, where the token is
#      the lowercased `MetadataSource` member the type names in its own `Source`
#      property.
#   2. A host with no page. A hostname in an http or https URL anywhere in the
#      tracked C#, comments included, has to be declared by a page as `Host:`,
#      or written down in `docs/sources/README.md` as `Not a source:` with the
#      reason beside it.
#   3. A page with no date. Every page states the day its terms were read, in
#      `Terms read: YYYY-MM-DD`, because an undated reading is a claim about
#      today made from an unknown day.
#
# What it cannot do. Leg 1 anchored on a file name until #394, so an adapter
# called anything else walked through it and whoever added the file chose whether
# its terms had to be read at all. It reads the base list and the `Source`
# property instead, which a source cannot rename its way out of, and three things
# are still outside it. It reads text rather than compiling, so a type whose base
# list is written across lines, or that reaches the interface through a base class
# rather than naming it, is not in the population. It cannot place a source whose
# `Source` property does not name a `MetadataSource` member in its own
# declaration, and it fails closed on one rather than passing it. And the test
# project is excluded by path, because a stand-in there reaches no third party and
# owes no terms page - so a file under that path that does reach one is invisible
# here and is `no-network-outside-source-adapter`'s subject instead. Leg 2 reads
# the text of the files, so a host assembled at run time from parts, or reached
# through a name resolved somewhere else, is invisible to it. No leg reads the
# prose of a page: it judges that the page exists and is dated, never that what
# it says about the source is true or complete. And it holds only sources this plugin talks to
# itself, so anything the server fetches on its own account is outside it.
name: source-terms

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Read-only: the check greps the tracked tree.
permissions:
  contents: read

concurrency:
  group: source-terms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terms:
    name: Every source carries its terms page
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Refuse a source with no terms page
        run: |
          set -euo pipefail

          pages_dir=docs/sources
          fail=0

          # Every read below tolerates "nothing matched" and refuses a reader
          # error. git grep exits 1 on a clean tree and 2 or more when it could
          # not read, and a scanner error taken for an empty result is this
          # check reporting that a tree it never read is fine.
          scan() {
            rc=0
            out=$(git grep "$@") || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::source-terms scanner error (git grep exit $rc) - failing closed instead of assuming there is nothing to find."
              exit 1
            fi
            printf '%s' "$out"
          }

          # Leg 1: a source with no page. What makes a file a source is the
          # interface it implements, never what it is called: a name is chosen by
          # whoever adds the file, so a suffix let a source decide for itself
          # whether its own terms had to be read (#394). The test project is
          # excluded by path rather than by a name pattern, and the reason is
          # that a stand-in there reaches no third party.
          sources=$(scan -lE '^[[:space:]]*(public|internal|private|protected|sealed|abstract|static|partial|file|[[:space:]])*\b(class|record|struct)\b[^={;]*:[^={;]*\bIMetadataSource\b' \
            -- '*.cs' ':!Jellyfin.Plugin.Template.Tests/')
          if [ -z "$sources" ]; then
            echo "leg 1: no type outside the test project implements IMetadataSource, so no page is owed by one."
          else
            echo "leg 1: reading $(printf '%s\n' "$sources" | wc -l | tr -d ' ') file(s) declaring a type that implements IMetadataSource."
            while IFS= read -r source; do
              [ -n "$source" ] || continue
              # Which body a source speaks for is the member it names in its own
              # `Source` property, which the interface requires it to answer and
              # which is a member of a closed enum. A source writing that property
              # some other way is refused rather than skipped: this leg cannot say
              # which terms such a file owes, and a source nobody can place is
              # what it exists to catch.
              member=$(sed -nE 's;.*\bMetadataSource[[:space:]]+Source\b[^;]*(=>|=)[[:space:]]*MetadataSource\.([A-Za-z0-9_]+).*;\2;p' "$source" | head -n 1)
              if [ -z "$member" ]; then
                echo "FAIL  leg 1: $source implements IMetadataSource and its Source property names no MetadataSource member in its own declaration, so which body it speaks for cannot be read here."
                fail=1
                continue
              fi
              if [ "$member" = "None" ]; then
                echo "FAIL  leg 1: $source implements IMetadataSource and declares MetadataSource.None, which is no body at all and can owe no terms page."
                fail=1
                continue
              fi
              token=$(printf '%s' "$member" | tr '[:upper:]' '[:lower:]')
              page="$pages_dir/$token.md"
              if [ ! -f "$page" ]; then
                echo "FAIL  leg 1: $source is a source for '$token' and $page does not exist."
                fail=1
              elif ! grep -q "^Source: $token\$" "$page"; then
                echo "FAIL  leg 1: $page exists and does not declare 'Source: $token'."
                fail=1
              else
                echo "ok    leg 1: $source speaks for '$token' and is covered by $page."
              fi
            done <<< "$sources"
          fi

          # Leg 2: a host with no page. Every tracked C# file is read whole, the
          # test project and the comments included. A namespace URI in a
          # serialised document is not an address anything is fetched from, and
          # the tree already carries one, so it is written down as an exception
          # rather than skipped by path.
          hosts=$(scan -hoIE 'https?://[A-Za-z0-9._-]+' -- '*.cs' \
            | sed -E 's;^https?://;;' | sort -u)
          if [ -z "$hosts" ]; then
            echo "leg 2: the plugin's C# names no host at all."
          else
            declared=$(scan -hoE '^Host: [A-Za-z0-9._-]+' -- "$pages_dir" | sed 's;^Host: ;;' | sort -u)
            excepted=$(scan -hoE '^Not a source: [A-Za-z0-9._-]+' -- "$pages_dir/README.md" \
              | sed 's;^Not a source: ;;' | sort -u)
            while IFS= read -r host; do
              [ -n "$host" ] || continue
              if printf '%s\n' "$declared" | grep -qxF "$host"; then
                echo "ok    leg 2: $host is declared by a terms page."
              elif printf '%s\n' "$excepted" | grep -qxF "$host"; then
                echo "ok    leg 2: $host is written down as not a source."
              else
                echo "FAIL  leg 2: the plugin's C# names $host and no page in $pages_dir declares it."
                fail=1
              fi
            done <<< "$hosts"
          fi

          # Leg 3: a page with no date.
          pages=$(git ls-files -- "$pages_dir/*.md" | grep -v "^$pages_dir/README.md\$" || true)
          if [ -z "$pages" ]; then
            echo "leg 3: there is no terms page in the tree."
          else
            while IFS= read -r page; do
              [ -n "$page" ] || continue
              if grep -qE '^Terms read: [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$page"; then
                echo "ok    leg 3: $page says when its terms were read."
              else
                echo "FAIL  leg 3: $page carries no 'Terms read: YYYY-MM-DD' line."
                fail=1
              fi
            done <<< "$pages"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::A metadata source in this tree has no terms page, or a page does not say when its terms were read. A source's terms are requirements on this plugin's behaviour, and a clause nobody wrote down is one nothing can be checked against. docs/sources/README.md says what a page carries."
            exit 1
          fi

          echo "Every source in the tree carries a dated terms page."

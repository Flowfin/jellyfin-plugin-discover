name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

jobs:
  call:
    # Kept as a call only until #29 replaces it with a scan this repository owns:
    # the upstream workflow gates itself on a repository name passed in below,
    # which is why the scan does not currently run here at all.
    permissions:
      security-events: write # upload the CodeQL SARIF into the code-scanning tab
      contents: read # checkout the tree to scan
      actions: read # read workflow run metadata for the analysis
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    with:
      repository-name: jellyfin/jellyfin-plugin-template

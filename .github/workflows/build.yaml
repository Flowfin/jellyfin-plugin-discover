name: "🏗️ Build Plugin"

# Neither trigger carries a path filter, and that is the point rather than an
# oversight (#154). The branch ruleset requires `call / build` on the default
# branch, and a workflow that declines to start reports nothing at all, so the
# merge is refused for a check that is missing rather than passed for a check
# that had nothing to say. A filter here does not skip a build, it makes every
# change it skips unmergeable, which is where every Markdown-only change in this
# repository sat until this was removed. The cost is a build on a change that
# cannot break one, and `required-check-runs-on-every-change` in tools/invariants
# is what refuses the filter coming back.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

jobs:
  call:
    # Kept as a call into the upstream reusable workflow rather than written out
    # here: it drives the plugin repository manager, which is the same tool the
    # publish path uses, so owning a copy of these steps would mean two
    # descriptions of one packaging procedure that can drift apart.
    permissions:
      contents: read # checkout; the artifact upload needs no token scope
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
